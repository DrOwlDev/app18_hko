name: Refresh Pages Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pages-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Collect HKO CSV archive
        run: dart run tool/collect_hko_data.dart data/hko

      - name: Export Hong Kong markets snapshot
        run: dart run tool/export_markets.dart web/data/markets.json

      - name: Snapshot collected data
        run: |
          mkdir -p /tmp/hko-refresh
          rm -rf /tmp/hko-refresh/hko
          cp -a data/hko /tmp/hko-refresh/hko
          cp web/data/markets.json /tmp/hko-refresh/markets.json

      - name: Commit archive + snapshot to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="Refresh HKO archive + markets $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/hko web/data
            cp -a /tmp/hko-refresh/hko/. data/hko/
            cp /tmp/hko-refresh/markets.json web/data/markets.json
            git add data/hko web/data/markets.json
            if git diff --staged --quiet; then
              echo "No data changes on main"
              exit 0
            fi
            git commit -m "$msg"
            if git push origin HEAD:main; then
              echo "Pushed to main"
              exit 0
            fi
            echo "Push to main rejected (attempt $attempt); retrying..."
            sleep $((attempt * 2))
          done
          echo "Failed to push to main after retries"
          exit 1

      - name: Checkout gh-pages
        id: ghpages
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Commit and push gh-pages data
        if: steps.ghpages.outcome == 'success'
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="Refresh HKO data $(date -u +%Y-%m-%dT%H:%MZ)"

          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            mkdir -p data/hko
            cp /tmp/hko-refresh/markets.json data/markets.json
            cp -a /tmp/hko-refresh/hko/. data/hko/
            git add data/
            if git diff --staged --quiet; then
              echo "No data changes on gh-pages"
              exit 0
            fi
            git commit -m "$msg"
            if git push origin HEAD:gh-pages; then
              echo "Pushed to gh-pages"
              exit 0
            fi
            echo "Push to gh-pages rejected (attempt $attempt); retrying..."
            sleep $((attempt * 2))
          done
          echo "Failed to push to gh-pages after retries"
          exit 1

      - name: Skip Pages update when gh-pages missing
        if: steps.ghpages.outcome != 'success'
        run: echo "gh-pages branch not ready yet; run Deploy GitHub Pages first"
