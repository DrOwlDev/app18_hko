name: Refresh Pages Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Collect HKO CSV archive
        run: dart run tool/collect_hko_data.dart data/hko

      - name: Export Hong Kong markets snapshot
        run: dart run tool/export_markets.dart web/data/markets.json

      - name: Commit archive + snapshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hko web/data/markets.json
          if git diff --staged --quiet; then
            echo "No data changes on main"
          else
            git commit -m "Refresh HKO archive + markets $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update snapshot + HKO data on Pages
        run: |
          mkdir -p gh-pages/data/hko
          cp web/data/markets.json gh-pages/data/markets.json
          cp -r data/hko/. gh-pages/data/hko/

      - name: Commit and push gh-pages data
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes on gh-pages"
            exit 0
          fi
          git commit -m "Refresh HKO data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:gh-pages
